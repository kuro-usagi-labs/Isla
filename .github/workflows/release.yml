name: Release Isla
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Build target family
        type: choice
        default: all
        options: [all, macos, windows, ubuntu]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      matrix: ${{ steps.release.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        id: release
        with:
          script: |
            const fs = require('fs');
            const version = JSON.parse(fs.readFileSync('package.json')).version;
            const tag = `v${version}`;
            const body = fs.readFileSync('docs/releases/v1.0.0.md', 'utf8');
            let release;
            try { release = (await github.rest.repos.getReleaseByTag({...context.repo, tag})).data; }
            catch(e) { if(e.status!==404) throw e; release = (await github.rest.repos.createRelease({...context.repo, tag_name:tag, target_commitish:context.sha, name:`Isla ${version}`, body, draft:true})).data; }
            core.setOutput('id', release.id);
            const platform = context.payload.inputs?.platform || 'all';
            const targets = [{os:'windows-latest',args:'--bundles nsis'},{os:'macos-latest',args:'--target aarch64-apple-darwin --bundles dmg'},{os:'macos-latest',args:'--target x86_64-apple-darwin --bundles dmg'},{os:'ubuntu-22.04',args:'--bundles deb,appimage'}];
            core.setOutput('matrix', {include: targets.filter(t=>platform==='all'||t.os.startsWith(platform))});
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '12.18.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux libraries
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev libxdo-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: '-'
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          releaseDraft: true
          args: ${{ matrix.args }}
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const release_id = Number('${{ needs.prepare.outputs.release_id }}');
            const assets = (await github.rest.repos.listReleaseAssets({...context.repo, release_id})).data;
            if (assets.length < 5) throw new Error('Expected Windows, two macOS architectures, Debian and AppImage assets');
            await github.rest.repos.updateRelease({...context.repo, release_id, draft:false});
